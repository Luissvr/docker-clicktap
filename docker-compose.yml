services:
  app: &php-service
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: clicktap_app
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs && chown -R www-data:www-data storage/framework storage/logs && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi && php-fpm"
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor
      - runtime_data:/var/www/html/storage/framework
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - clicktap_network
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: clicktap_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-clicktap_db}
      DB_USERNAME: ${DB_USERNAME:-clicktap_user}
      DB_PASSWORD: ${DB_PASSWORD:-clicktap_secret}
      DB_SCHEMA: public
      DB_SSLMODE: disable
    depends_on:
      - db

  publication-worker:
    <<: *php-service
    container_name: clicktap_publication_worker
    user: www-data
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan clicktap:publication-worker"
    depends_on:
      - app

  web:
    image: nginx:alpine
    container_name: clicktap_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - clicktap_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: clicktap_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-clicktap_db}
      POSTGRES_USER: ${DB_USERNAME:-clicktap_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clicktap_secret}
      TZ: America/Santiago
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clicktap_network

networks:
  clicktap_network:
    driver: bridge

volumes:
  postgres_data:
    name: clicktap_postgres_data
  vendor_data:
    name: clicktap_vendor_data
  runtime_data:
    name: clicktap_runtime_data
